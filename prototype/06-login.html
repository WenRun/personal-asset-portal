<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 / 注册 · 个人资源门户</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:{50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca'}}}}}</script>
</head>
<body class="min-h-screen grid place-items-center text-slate-800 antialiased font-sans" style="background:linear-gradient(160deg,#eef2ff,#e0e7ff 40%,#c7d2fe)">
<div class="w-full max-w-sm px-6">
  <div class="flex items-center gap-2.5 justify-center mb-8">
    <div class="w-11 h-11 rounded-xl bg-brand-600 grid place-items-center text-white font-bold text-lg shadow-lg">资</div>
    <div><div class="text-xl font-bold">个人资源门户</div><div class="text-xs text-slate-500">字体 · 音乐 · 视频 · 书籍 · 图片</div></div>
  </div>

  <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
    <!-- Tab -->
    <div class="grid grid-cols-2 text-sm font-medium">
      <button class="py-3 bg-white text-brand-600 border-b-2 border-brand-600">登录</button>
      <button class="py-3 bg-slate-50 text-slate-400 border-b-2 border-transparent hover:text-slate-600">注册</button>
    </div>
    <form class="p-6 space-y-4" onsubmit="return false">
      <div>
        <label class="text-xs font-medium text-slate-500 mb-1 block">用户名</label>
        <input placeholder="username" class="w-full px-3 py-2.5 rounded-lg border border-slate-200 outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 text-sm">
      </div>
      <div>
        <label class="text-xs font-medium text-slate-500 mb-1 block">密码</label>
        <input type="password" placeholder="••••••••" class="w-full px-3 py-2.5 rounded-lg border border-slate-200 outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 text-sm">
      </div>
      <div class="flex items-center justify-between text-xs">
        <label class="flex items-center gap-1.5 text-slate-500"><input type="checkbox" checked class="accent-brand-600">记住我（30 天）</label>
        <span class="text-slate-400">argon2id + 服务端会话</span>
      </div>
      <button class="w-full py-2.5 rounded-lg bg-brand-600 text-white text-sm font-medium hover:bg-brand-700 transition">登 录</button>
    </form>
    <div class="px-6 pb-5 text-xs text-slate-400 leading-relaxed">
      注册当前开放，注册后可搜索、预览与下载；上传与系统设置仅管理员可用。首个管理员账号由部署环境变量创建。
    </div>
  </div>

  <div class="text-center mt-6 text-xs text-slate-400">访客可直接浏览资源列表 · <a href="07-guest-state.html" class="underline hover:text-brand-600">以访客身份看看 →</a></div>
  <div class="text-center mt-2"><a href="index.html" class="text-xs text-slate-400 hover:text-brand-600">← 原型导航</a></div>
</div>
</body>
</html>
