# 生产部署（2026-10-07 拓扑定稿：NGINX 统一入口 + 外部 PG/Meili 容器）。
# 前提：你的 NGINX、PostgreSQL(13+)、Meilisearch 已是独立容器且在同一 Docker 网络。
# 用法：
#   1) 复制 .env.example 为 .env，填写网络名、容器名与口令（.env 已 gitignore）
#   2) docker compose up -d --build
#   3) 按 deploy/nginx-portal.conf 样例把你现有 NGINX 的 /api 与 / 反代到本分组
# 说明：
#   - server/worker 共享 portal_data 卷（worker 写派生物、server 读，必须在同一卷）
#   - 本分组不发布宿主机端口：仅与外部网络互通，公网流量一律经你的 NGINX
#   - cookie/上传上限等安全参数见 .env.example； alembic 迁移在 server 启动时自动执行

services:
  portal-server:
    build: ./server
    environment: &server_env
      DATABASE_URL: postgresql+asyncpg://${PG_USER:-portal}:${PG_PASSWORD:?请在 .env 设置 PG_PASSWORD}@${PG_HOST:?请在 .env 设置 PG_HOST}:5432/${PG_DB:-portal}
      MEILI_URL: http://${MEILI_HOST:?请在 .env 设置 MEILI_HOST}:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?请在 .env 设置 MEILI_MASTER_KEY}
      DATA_ROOT: /data
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?请在 .env 设置强口令}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      # 信任反代头（仅私有容器网络内，用于日志与客户端 IP 还原）
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - portal_data:/data
    networks: [portal-net]
    restart: unless-stopped

  portal-worker:
    build: ./server
    command: python -m app.core.worker
    environment: *server_env
    volumes:
      - portal_data:/data
    networks: [portal-net]
    restart: unless-stopped

  # 前端静态容器：构建产物由内置 nginx 托管（SPA 回退 + 带哈希资源长缓存），
  # TLS 仍由你的外层 NGINX 终结；外层 / 反代到 http://portal-web:80 即可。
  portal-web:
    build: ./web
    networks: [portal-net]
    restart: unless-stopped

networks:
  portal-net:
    external: true
    name: ${DOCKER_NETWORK:?请在 .env 设置与 NGINX/PG/Meili 相同的网络名}

volumes:
  portal_data:
