services:
  # 数据库与搜索均为本机通用容器，不在本项目分组内：
  # - postgres-dev   （宿主 5432，portal 库）
  #   口令经环境变量 POSTGRES_PASSWORD 注入（compose 自动读取本目录 .env，该文件不提交）
  # - meilisearch-dev（宿主 7700，密钥 dev-meili-master-key，命名卷 meilisearch-dev-data）
  # 本地开发：server/worker 直接本机运行（见 server/README.md），无需本文件。
  # 全容器部署时通过 host.docker.internal 访问上述通用容器。

  server:
    build: ./server
    environment: &server_env
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?请在 docker-compose.yml 同目录的 .env 中设置 POSTGRES_PASSWORD}@host.docker.internal:5432/portal
      MEILI_URL: http://host.docker.internal:7700
      MEILI_MASTER_KEY: dev-meili-master-key
      DATA_ROOT: /data
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: admin1234
      FRONTEND_ORIGIN: http://localhost:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - portal_data:/data

  worker:
    build: ./server
    command: python -m app.core.worker
    environment: *server_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - portal_data:/data

volumes:
  portal_data:
