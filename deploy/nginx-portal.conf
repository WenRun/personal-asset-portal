# ─────────────────────────────────────────────────────────────────────────
# 门户站点 NGINX 配置样例（并入你现有 NGINX 的 server 块；2026-10-07 起
# 取代 deploy/Caddyfile——你环境已有 NGINX 统一入口 + HTTPS，不引入 Caddy）。
#
# 前提：portal 的 compose 分组已接入你 NGINX 所在的 Docker 网络（.env 的
# DOCKER_NETWORK），服务名 portal-server / portal-web 可被 DNS 解析。
#
# 三个关键点（缺一会在对应功能上踩坑）：
#   1) client_max_body_size  —— NGINX 默认 1MB，网页上传直接 413；
#      与服务端 MAX_UPLOAD_GB（默认 8）保持一致。
#   2) SSE：/api/admin/jobs/stream 的实时推送要求 proxy_buffering off
#      （应用响应已带 X-Accel-Buffering: no 作为双保险）。
#   3) 音视频/音频流与下载依赖 Range 分段请求，NGINX 默认透传，无需额外配置。
# ─────────────────────────────────────────────────────────────────────────

server {
    listen 443 ssl;
    http2 on;
    server_name portal.example.com;

    # TLS 证书用你现有的体系（略）

    client_max_body_size 8g;   # = MAX_UPLOAD_GB

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # API（含 SSE 与音视频 Range 流）
    location /api/ {
        proxy_pass http://portal-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 任务流：关闭缓冲；keepalive 每 15s 一次，300s 超时留足余量
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 前端静态（compose 分组内的 portal-web，内置 SPA 回退与产物长缓存）
    location / {
        proxy_pass http://portal-web:80;
        proxy_set_header Host $host;
    }
}
