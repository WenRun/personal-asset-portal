# portal 前端静态托管（容器内）：SPA 回退 + 带哈希构建产物长缓存；gzip 内置开启。
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # Vite 产物文件名含内容哈希：内容不变，可缓存一年
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA：前端路由全部回退到 index.html
    location / {
        try_files $uri /index.html;
    }
}
